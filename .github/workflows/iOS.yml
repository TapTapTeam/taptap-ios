name: iOS CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    tags:
      - "v*"

jobs:
  ios:
    runs-on: macos-26
    env:
      TUIST_VERSION: 4.57.1
    steps:
    - uses: actions/checkout@v4
    
    - name: Mise
      uses: jdx/mise-action@v2

    - name: Xcode version
      run: xcodebuild -version
      
    - uses: ruby/setup-ruby@v1
      with:
        ruby-version: '3.2'
        bundler-cache: true
        
    - name: Create xcconfig file
      run: |
        mkdir -p TapTap/Tuist/Config
        echo "${{ secrets.PROJECT_XCCONFIG_CONTENT }}" >TapTap/Tuist/Config/Project.xcconfig
    - name: Create GoogleService-Info.plist
      # GA4(Firebase) 설정 파일. .gitignore에 걸려 있어서 CI에선 시크릿으로 복원한다.
      # 시크릿이 비어 있으면 파일을 만들지 않고, AnalyticsKit이 GA4를 건너뛴 채 빌드된다.
      env:
        GOOGLE_SERVICE_INFO_PLIST: ${{ secrets.GOOGLE_SERVICE_INFO_PLIST }}
      run: |
        if [ -n "$GOOGLE_SERVICE_INFO_PLIST" ]; then
          echo "$GOOGLE_SERVICE_INFO_PLIST" > TapTap/Projects/App/Resources/GoogleService-Info.plist
        else
          echo "::warning::GOOGLE_SERVICE_INFO_PLIST 시크릿이 없다 — 이 빌드는 GA4 없이 나간다."
        fi
    - name: Set up App Store Connect API
      env:
        ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
      run: |
        mkdir -p ~/.appstoreconnect/private_keys
        echo "$ASC_PRIVATE_KEY" > ~/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8
        echo "ASC_KEY_FILEPATH=$HOME/.appstoreconnect/private_keys/AuthKey_${{ secrets.ASC_KEY_ID }}.p8" >> $GITHUB_ENV
    - name: Setup Git Auth
      run: |
        git config --global url."https://${{ secrets.MATCH_GIT_BASIC_AUTH}}@github.com/".insteadOf "https://github.com/"
        
    - name: Install Tuist
      run: mise install tuist@${{ env.TUIST_VERSION }}
      
    - name: Tuist version
      run: mise use -g tuist@${{ env.TUIST_VERSION }}
      
    - name: Tuist Generate
      working-directory: TapTap
      run: |
        tuist install
        tuist generate --no-open
    - name: Fastlane
      working-directory: TapTap
      env:
        ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        BUNDLE_GEMFILE: ../Gemfile
        ASC_KEY_FILEPATH: ${{ env.ASC_KEY_FILEPATH }}
        APPLE_ID: ${{ secrets.APPLE_ID }}
        MATCH_PASSWORD: ${{ secrets.MATCH_PASSWORD }}
        MATCH_GIT_BASIC_AUTH: ${{ secrets.MATCH_GIT_BASIC_AUTH }}
      run: |
        if [[ ${GITHUB_REF} == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF#refs/tags/v}
          bundle exec fastlane ios ci_release version:$VERSION
        else
          bundle exec fastlane ios ci_beta
        fi
